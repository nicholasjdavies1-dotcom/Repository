<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinball</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      user-select: none;
    }

    .cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .marquee {
      background: linear-gradient(180deg, #1a0030, #2a0050);
      border: 2px solid #6600cc;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 6px 20px;
      color: #cc44ff;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 6px;
      text-shadow: 0 0 10px #aa00ff, 0 0 20px #aa00ff;
      box-shadow: 0 0 20px rgba(170,0,255,0.4);
    }

    .playfield-wrap {
      border: 3px solid #440088;
      border-top: none;
      border-bottom: none;
      background: #050010;
      box-shadow: inset 0 0 40px rgba(100,0,200,0.3), 0 0 30px rgba(100,0,200,0.3);
    }

    canvas {
      display: block;
    }

    .panel {
      background: linear-gradient(180deg, #0d0020, #150030);
      border: 3px solid #440088;
      border-top: 2px solid #220044;
      border-radius: 0 0 12px 12px;
      padding: 10px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      color: #cc44ff;
      font-size: 12px;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #aa00ff;
    }

    .flipper-btns {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 8px;
    }

    .flipper-btn {
      flex: 1;
      height: 44px;
      background: linear-gradient(180deg, #2a0050, #1a0030);
      border: 2px solid #6600cc;
      border-radius: 8px;
      color: #cc44ff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      text-shadow: 0 0 6px #aa00ff;
      box-shadow: 0 0 10px rgba(170,0,255,0.2);
      transition: background 0.05s, box-shadow 0.05s;
      -webkit-tap-highlight-color: transparent;
    }

    .flipper-btn:active, .flipper-btn.pressed {
      background: linear-gradient(180deg, #5500aa, #3a0077);
      box-shadow: 0 0 20px rgba(170,0,255,0.6);
    }

    .hint {
      color: #440066;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="cabinet">
  <div class="marquee">PINBALL</div>

  <div class="playfield-wrap">
    <canvas id="c" width="280" height="480"></canvas>
  </div>

  <div class="panel">
    <div class="hud">
      <span id="score-el">SCORE: 0</span>
      <span id="ball-el">BALL: 1 / 3</span>
      <span id="hi-el">BEST: 0</span>
    </div>
    <div class="flipper-btns">
      <button class="flipper-btn" id="btn-left">◀ LEFT<br><span style="font-size:9px;opacity:0.6">Z / ←</span></button>
      <button class="flipper-btn" id="btn-right">RIGHT ▶<br><span style="font-size:9px;opacity:0.6">/ / →</span></button>
    </div>
    <div class="hint">SPACE / CLICK to launch</div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ── Colours ──────────────────────────────────────────────────────────────
  const C = {
    bg:       '#050010',
    wall:     '#6600cc',
    wallGlow: 'rgba(170,0,255,0.5)',
    flipper:  '#cc44ff',
    ball:     '#ffffff',
    ballGlow: 'rgba(255,255,255,0.6)',
    bumper:   '#ff2266',
    bumperLit:'#ff88bb',
    bumperGlow:'rgba(255,34,102,0.7)',
    lane:     '#ffcc00',
    laneGlow: 'rgba(255,204,0,0.5)',
    text:     '#cc44ff',
    textGlow: '#aa00ff',
  };

  // ── Physics constants ─────────────────────────────────────────────────────
  const GRAVITY   = 0.18;
  const FRICTION  = 0.985;
  const BALL_R    = 7;
  const WALL_L    = 28;   // left wall x
  const WALL_R    = W - 28; // right wall x

  // ── Game state ────────────────────────────────────────────────────────────
  let score = 0, ball = 1, totalBalls = 3;
  let hiScore = parseInt(localStorage.getItem('pb_hi') || '0');
  let gameState = 'idle'; // idle | playing | launch | dead | over

  let bx, by, bvx, bvy;
  let launched = false;

  // Flipper state
  const FL = { active: false }; // left
  const FR = { active: false }; // right

  // Flipper geometry (pivot, rest angle, active angle, length)
  const FLIP_Y   = H - 75;
  const FLIP_LEN = 52;
  const FLIP_L = { px: WALL_L + 18, py: FLIP_Y, restA: 0.5,  activeA: -0.5,  dir:  1 };
  const FLIP_R = { px: WALL_R - 18, py: FLIP_Y, restA: Math.PI - 0.5, activeA: Math.PI + 0.5, dir: -1 };

  let flipLAngle = FLIP_L.restA;
  let flipRAngle = FLIP_R.restA;

  // Bumpers: {x, y, r, pts, lit, litTimer}
  const BUMPERS = [
    { x: 100, y: 160, r: 18, pts: 100, lit: false, litTimer: 0 },
    { x: 180, y: 140, r: 18, pts: 100, lit: false, litTimer: 0 },
    { x: 140, y: 210, r: 18, pts: 150, lit: false, litTimer: 0 },
  ];

  // Slingshots (triangular kickers on sides)
  // Each: {x1,y1, x2,y2, nx,ny} — a line segment + outward normal
  const SLINGS = [
    makeSling(WALL_L + 2, 310, WALL_L + 28, 360, 1),   // left
    makeSling(WALL_R - 2, 310, WALL_R - 28, 360, -1),  // right
  ];

  // Lane targets at top (3 lights)
  const LANES = [
    { x: 80,  y: 55, lit: false },
    { x: 140, y: 48, lit: false },
    { x: 200, y: 55, lit: false },
  ];
  let lanesComplete = false;
  let laneBonus = 1;

  // Plunger lane (right gutter lane for launching)
  // Ball starts in plunger lane on right
  const PLUNGER_X = WALL_R + 14;
  let plungerPower = 0;
  let plungerCharging = false;

  function makeSling(x1, y1, x2, y2, side) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    return { x1, y1, x2, y2, nx: -dy / len * side, ny: dx / len * side, lit: false, litTimer: 0 };
  }

  // ── HUD ───────────────────────────────────────────────────────────────────
  const scoreEl = document.getElementById('score-el');
  const ballEl  = document.getElementById('ball-el');
  const hiEl    = document.getElementById('hi-el');

  function updateHUD() {
    scoreEl.textContent = 'SCORE: ' + score.toLocaleString();
    ballEl.textContent  = 'BALL: ' + ball + ' / ' + totalBalls;
    hiEl.textContent    = 'BEST: ' + hiScore.toLocaleString();
  }

  // ── Ball reset ────────────────────────────────────────────────────────────
  function resetBall() {
    bx  = PLUNGER_X;
    by  = H - 120;
    bvx = 0;
    bvy = 0;
    launched = false;
    plungerPower = 0;
    gameState = 'launch';
  }

  function startGame() {
    score = 0;
    ball  = 1;
    LANES.forEach(l => l.lit = false);
    lanesComplete = false;
    laneBonus = 1;
    resetBall();
    gameState = 'launch';
    updateHUD();
  }

  // ── Physics helpers ───────────────────────────────────────────────────────
  function circleLineCollide(cx, cy, cr, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = ((cx - x1) * dx + (cy - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const nx = cx - (x1 + t * dx);
    const ny = cy - (y1 + t * dy);
    const dist = Math.hypot(nx, ny);
    return dist < cr ? { dist, nx: nx / dist, ny: ny / dist } : null;
  }

  function flipperEndpoint(f, angle) {
    return {
      x: f.px + Math.cos(angle) * FLIP_LEN,
      y: f.py + Math.sin(angle) * FLIP_LEN,
    };
  }

  function resolveFlipperCollision(f, angle, angularVel) {
    const tip = flipperEndpoint(f, angle);
    const hit = circleLineCollide(bx, by, BALL_R, f.px, f.py, tip.x, tip.y);
    if (!hit) return;

    // Push out
    const overlap = BALL_R - hit.dist;
    bx += hit.nx * overlap;
    by += hit.ny * overlap;

    // Reflect velocity + add flipper kick
    const dot = bvx * hit.nx + bvy * hit.ny;
    if (dot < 0) {
      const boost = angularVel * FLIP_LEN * 0.45;
      bvx = (bvx - 2 * dot * hit.nx) * 0.75;
      bvy = (bvy - 2 * dot * hit.ny) * 0.75 - boost;
    }
  }

  function resolveBumper(b) {
    const dx = bx - b.x, dy = by - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist < BALL_R + b.r) {
      const nx = dx / dist, ny = dy / dist;
      // Push out
      bx = b.x + nx * (BALL_R + b.r + 1);
      by = b.y + ny * (BALL_R + b.r + 1);
      // Strong bounce
      const speed = Math.hypot(bvx, bvy);
      bvx = nx * Math.max(speed, 5) * 1.1;
      bvy = ny * Math.max(speed, 5) * 1.1;
      // Score
      score += b.pts * laneBonus;
      b.lit = true;
      b.litTimer = 12;
      updateHUD();
    }
  }

  function resolveSling(s) {
    const hit = circleLineCollide(bx, by, BALL_R, s.x1, s.y1, s.x2, s.y2);
    if (!hit) return;
    const overlap = BALL_R - hit.dist;
    bx += hit.nx * overlap;
    by += hit.ny * overlap;
    const dot = bvx * hit.nx + bvy * hit.ny;
    if (dot < 0) {
      bvx = (bvx - 2 * dot * hit.nx) * 1.15;
      bvy = (bvy - 2 * dot * hit.ny) * 1.15;
      score += 50 * laneBonus;
      s.lit = true;
      s.litTimer = 8;
      updateHUD();
    }
  }

  function resolveLane(l) {
    const dist = Math.hypot(bx - l.x, by - l.y);
    if (dist < BALL_R + 8 && !l.lit) {
      l.lit = true;
      score += 500 * laneBonus;
      checkLanes();
      updateHUD();
    }
  }

  function checkLanes() {
    if (LANES.every(l => l.lit)) {
      lanesComplete = true;
      laneBonus++;
      score += 2000;
      // Reset lanes after brief pause
      setTimeout(() => {
        LANES.forEach(l => l.lit = false);
        lanesComplete = false;
        updateHUD();
      }, 1500);
      updateHUD();
    }
  }

  // ── Update ────────────────────────────────────────────────────────────────
  let leftAngVel = 0, rightAngVel = 0;

  function update() {
    // Animate flippers
    const targetL = FL.active ? FLIP_L.activeA : FLIP_L.restA;
    const targetR = FR.active ? FLIP_R.activeA : FLIP_R.restA;
    const prevL = flipLAngle, prevR = flipRAngle;
    flipLAngle += (targetL - flipLAngle) * 0.35;
    flipRAngle += (targetR - flipRAngle) * 0.35;
    leftAngVel  = flipLAngle - prevL;
    rightAngVel = flipRAngle - prevR;

    // Bumper light timers
    BUMPERS.forEach(b => { if (b.litTimer > 0) { b.litTimer--; if (!b.litTimer) b.lit = false; } });
    SLINGS.forEach(s  => { if (s.litTimer > 0) { s.litTimer--; if (!s.litTimer) s.lit = false; } });

    if (gameState === 'launch') {
      if (plungerCharging) {
        plungerPower = Math.min(plungerPower + 0.6, 18);
      }
      return;
    }

    if (gameState !== 'playing') return;

    // Gravity + friction
    bvy += GRAVITY;
    bvx *= FRICTION;
    bvy *= FRICTION;

    bx += bvx;
    by += bvy;

    // Wall collisions
    if (bx - BALL_R < WALL_L) {
      bx = WALL_L + BALL_R;
      bvx = Math.abs(bvx) * 0.7;
    }
    if (bx + BALL_R > WALL_R) {
      // Plunger lane: ball is in right gutter — let it travel freely
      if (bx + BALL_R > W - 4) {
        bx = W - 4 - BALL_R;
        bvx = -Math.abs(bvx) * 0.7;
      }
    }
    if (by - BALL_R < 40) {
      by = 40 + BALL_R;
      bvy = Math.abs(bvy) * 0.7;
    }

    // Flippers
    resolveFlipperCollision(FLIP_L, flipLAngle, leftAngVel);
    resolveFlipperCollision(FLIP_R, flipRAngle, rightAngVel);

    // Bumpers
    BUMPERS.forEach(resolveBumper);

    // Slingshots
    SLINGS.forEach(resolveSling);

    // Lanes
    LANES.forEach(resolveLane);

    // Drain detection
    if (by > H + BALL_R * 2) {
      if (ball < totalBalls) {
        ball++;
        gameState = 'dead';
        setTimeout(() => { resetBall(); updateHUD(); }, 1200);
      } else {
        gameState = 'over';
        if (score > hiScore) {
          hiScore = score;
          localStorage.setItem('pb_hi', hiScore);
        }
        updateHUD();
      }
    }
  }

  // ── Drawing ───────────────────────────────────────────────────────────────
  function glowLine(x1, y1, x2, y2, color, glow, w) {
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur  = 12;
    ctx.strokeStyle = color;
    ctx.lineWidth   = w || 3;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function glowCircle(x, y, r, fill, glow) {
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur  = 18;
    ctx.fillStyle   = fill;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function glowText(text, x, y, size, color, glow) {
    ctx.save();
    ctx.shadowColor = glow || color;
    ctx.shadowBlur  = 14;
    ctx.fillStyle   = color;
    ctx.font        = `bold ${size}px monospace`;
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawWalls() {
    // Left wall
    glowLine(WALL_L, 40, WALL_L, H, C.wall, C.wallGlow);
    // Right wall (stops before drain gap, leaving plunger lane)
    glowLine(WALL_R, 40, WALL_R, FLIP_Y - 10, C.wall, C.wallGlow);
    // Plunger lane divider (inner right wall)
    glowLine(W - 4, 40, W - 4, H, C.wall, C.wallGlow, 2);
    // Top arch
    ctx.save();
    ctx.shadowColor = C.wallGlow;
    ctx.shadowBlur  = 12;
    ctx.strokeStyle = C.wall;
    ctx.lineWidth   = 3;
    ctx.beginPath();
    ctx.moveTo(WALL_L, 40);
    ctx.quadraticCurveTo(W / 2, 10, W - 4, 40);
    ctx.stroke();
    ctx.restore();
    // Drain gap walls (angled inward)
    glowLine(WALL_L, FLIP_Y + 10, WALL_L + 18, FLIP_Y + 30, C.wall, C.wallGlow);
    glowLine(WALL_R, FLIP_Y + 10, WALL_R - 18, FLIP_Y + 30, C.wall, C.wallGlow);
  }

  function drawSlings() {
    SLINGS.forEach(s => {
      const col  = s.lit ? '#ff88ff' : C.wall;
      const glow = s.lit ? 'rgba(255,100,255,0.9)' : C.wallGlow;
      glowLine(s.x1, s.y1, s.x2, s.y2, col, glow, 4);
    });
  }

  function drawBumpers() {
    BUMPERS.forEach(b => {
      const fill = b.lit ? C.bumperLit : C.bumper;
      const glow = b.lit ? 'rgba(255,150,200,0.9)' : C.bumperGlow;
      glowCircle(b.x, b.y, b.r, fill, glow);
      // Inner ring
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      // Score label
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.pts, b.x, b.y);
    });
  }

  function drawLanes() {
    LANES.forEach(l => {
      const fill = l.lit ? C.lane : 'rgba(255,204,0,0.2)';
      const glow = l.lit ? C.laneGlow : 'transparent';
      glowCircle(l.x, l.y, 7, fill, glow);
    });
  }

  function drawFlipper(f, angle, color) {
    const tip = flipperEndpoint(f, angle);
    ctx.save();
    ctx.shadowColor = 'rgba(200,100,255,0.7)';
    ctx.shadowBlur  = 10;
    ctx.strokeStyle = color;
    ctx.lineWidth   = 8;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(f.px, f.py);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    ctx.restore();
  }

  function drawBall() {
    // Glow
    const grad = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, BALL_R);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, 'rgba(200,200,255,0.5)');
    ctx.save();
    ctx.shadowColor = C.ballGlow;
    ctx.shadowBlur  = 16;
    ctx.fillStyle   = grad;
    ctx.beginPath();
    ctx.arc(bx, by, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlunger() {
    const py = by + 10;
    const ph = plungerPower * 2.5;
    ctx.fillStyle = '#8844cc';
    ctx.fillRect(PLUNGER_X - 5, py, 10, ph);
    ctx.fillStyle = '#cc66ff';
    ctx.fillRect(PLUNGER_X - 7, py + ph, 14, 8);
  }

  function drawLaneBonusLabel() {
    if (laneBonus > 1) {
      glowText('x' + laneBonus + ' BONUS', W / 2, H - 50, 9, C.lane, C.laneGlow);
    }
  }

  function draw() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    drawWalls();
    drawSlings();
    drawBumpers();
    drawLanes();

    // Lane labels
    glowText('[ LIGHT LANES ]', W / 2, 32, 8, 'rgba(255,204,0,0.5)', 'transparent');

    drawLaneBonusLabel();

    drawFlipper(FLIP_L, flipLAngle, FL.active ? '#ff88ff' : C.flipper);
    drawFlipper(FLIP_R, flipRAngle, FR.active ? '#ff88ff' : C.flipper);

    if (gameState === 'launch') {
      drawBall();
      drawPlunger();
      glowText('HOLD SPACE TO CHARGE', W / 2, H / 2 + 40, 9, C.text, C.textGlow);
      glowText('RELEASE TO LAUNCH', W / 2, H / 2 + 54, 9, C.text, C.textGlow);
    } else if (gameState === 'playing' || gameState === 'dead') {
      drawBall();
    }

    if (gameState === 'dead') {
      glowText('DRAIN!', W / 2, H / 2, 22, '#ff2266', 'rgba(255,34,102,0.8)');
    }

    if (gameState === 'over') {
      ctx.fillStyle = 'rgba(5,0,16,0.75)';
      ctx.fillRect(0, 0, W, H);
      glowText('GAME OVER', W / 2, H / 2 - 40, 24, '#ff2266', 'rgba(255,34,102,0.9)');
      glowText('SCORE: ' + score.toLocaleString(), W / 2, H / 2, 14, C.text, C.textGlow);
      glowText('BEST:  ' + hiScore.toLocaleString(), W / 2, H / 2 + 24, 14, C.text, C.textGlow);
      if (Math.floor(Date.now() / 600) % 2 === 0) {
        glowText('PRESS SPACE TO PLAY', W / 2, H / 2 + 60, 11, C.text, C.textGlow);
      }
    }

    if (gameState === 'idle') {
      glowText('PINBALL', W / 2, H / 2 - 30, 28, C.text, C.textGlow);
      if (Math.floor(Date.now() / 600) % 2 === 0) {
        glowText('PRESS SPACE TO START', W / 2, H / 2 + 10, 11, C.text, C.textGlow);
      }
      glowText('Z / ←  LEFT FLIPPER', W / 2, H / 2 + 40, 9, '#8844cc', C.textGlow);
      glowText('/ / →  RIGHT FLIPPER', W / 2, H / 2 + 54, 9, '#8844cc', C.textGlow);
    }

    if (lanesComplete) {
      glowText('LANES COMPLETE!', W / 2, H / 2 - 60, 13, C.lane, C.laneGlow);
    }
  }

  // ── Loop ──────────────────────────────────────────────────────────────────
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ── Input ─────────────────────────────────────────────────────────────────
  function launchBall() {
    if (gameState !== 'launch') return;
    const power = plungerPower;
    plungerPower = 0;
    plungerCharging = false;
    bvx = -2.5;
    bvy = -(power + 4);
    gameState = 'playing';
  }

  function tryStart() {
    if (gameState === 'idle' || gameState === 'over') startGame();
  }

  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'z': case 'Z': case 'ArrowLeft':  FL.active = true;  e.preventDefault(); break;
      case '/': case 'ArrowRight':            FR.active = true;  e.preventDefault(); break;
      case ' ': case 'Enter':
        e.preventDefault();
        if (gameState === 'idle' || gameState === 'over') { tryStart(); return; }
        if (gameState === 'launch') { plungerCharging = true; }
        break;
    }
  });

  document.addEventListener('keyup', e => {
    switch (e.key) {
      case 'z': case 'Z': case 'ArrowLeft':  FL.active = false; break;
      case '/': case 'ArrowRight':            FR.active = false; break;
      case ' ': case 'Enter':
        if (gameState === 'launch' && plungerCharging) launchBall();
        break;
    }
  });

  // On-screen flipper buttons
  function wireFlip(id, state) {
    const el = document.getElementById(id);
    ['mousedown','touchstart'].forEach(ev =>
      el.addEventListener(ev, e => { e.preventDefault(); state.active = true; el.classList.add('pressed'); }, { passive: false })
    );
    ['mouseup','touchend','mouseleave'].forEach(ev =>
      el.addEventListener(ev, () => { state.active = false; el.classList.remove('pressed'); })
    );
  }
  wireFlip('btn-left',  FL);
  wireFlip('btn-right', FR);

  // Tap canvas to start / launch
  canvas.addEventListener('click', () => {
    if (gameState === 'idle' || gameState === 'over') tryStart();
    else if (gameState === 'launch') {
      if (!plungerCharging) { plungerCharging = true; }
      else launchBall();
    }
  });

  // Long-press canvas for plunger charge on mobile
  let pressTimer = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (gameState === 'launch') {
      plungerCharging = true;
    } else {
      tryStart();
    }
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (gameState === 'launch' && plungerCharging) launchBall();
  }, { passive: false });

  updateHUD();
  loop();
})();
</script>
</body>
</html>
